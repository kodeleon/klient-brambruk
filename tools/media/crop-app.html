<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kadrowanie - pipeline mediów</title>
<style>
  :root {
    --bg: #17161a; --panel: #201f24; --line: #34323a; --text: #e9e6e1;
    --dim: #9b958c; --ok: #5fb87a; --warn: #d9a441; --bad: #d9564a; --accent: #7aa7d9;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  /* --- scena ------------------------------------------------------- */
  #stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; min-width: 0; }
  #stage { position: relative; user-select: none; touch-action: none; box-shadow: 0 0 0 1px var(--line); }
  #photo { display: block; width: 100%; height: 100%; }
  /* Wszystko poza kadrem przygaszone - kadr ma być tym, co widać.
     Przyciemnienie rysuje ścieżka SVG z fill-rule=evenodd (prostokąt sceny
     minus prostokąt kadru), nie tło elementu. */
  #shade { position: absolute; inset: 0; pointer-events: none; }
  #crop { position: absolute; outline: 2px solid var(--accent); cursor: move; }
  #crop.bad { outline-color: var(--bad); }
  #crop.tight { outline-color: var(--warn); }
  .handle { position: absolute; width: 14px; height: 14px; background: var(--accent);
            border: 2px solid #12121a; border-radius: 2px; }
  #crop.bad .handle { background: var(--bad); }
  #crop.tight .handle { background: var(--warn); }
  .h-nw { left: -7px; top: -7px; cursor: nwse-resize; }
  .h-ne { right: -7px; top: -7px; cursor: nesw-resize; }
  .h-sw { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .h-se { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .h-n { left: 50%; top: -7px; margin-left: -7px; cursor: ns-resize; }
  .h-s { left: 50%; bottom: -7px; margin-left: -7px; cursor: ns-resize; }
  .h-w { left: -7px; top: 50%; margin-top: -7px; cursor: ew-resize; }
  .h-e { right: -7px; top: 50%; margin-top: -7px; cursor: ew-resize; }

  /* --- strefy bezpieczne ------------------------------------------- */
  .zone { position: absolute; pointer-events: none; font-size: 10px; line-height: 1.2; }
  .zone.margin { outline: 1px dashed rgba(233,230,225,.45); }
  .zone.safe { outline: 1px solid rgba(95,184,122,.75); }
  .zone.cover { background: repeating-linear-gradient(45deg,
                  rgba(217,86,74,.20) 0 6px, rgba(217,86,74,.06) 6px 12px);
                outline: 1px solid rgba(217,86,74,.5); }
  body.hide-zones .zone { display: none; }

  /* --- panel ------------------------------------------------------- */
  aside { width: 380px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
          display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .body { padding: 14px 18px; overflow-y: auto; flex: 1; }
  footer { padding: 14px 18px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

  .verdict { padding: 10px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 14px; }
  .verdict.ok   { background: rgba(95,184,122,.14); border: 1px solid rgba(95,184,122,.4); }
  .verdict.tight{ background: rgba(217,164,65,.14); border: 1px solid rgba(217,164,65,.4); }
  .verdict.bad  { background: rgba(217,86,74,.14);  border: 1px solid rgba(217,86,74,.45); }
  .verdict b { display: block; margin-bottom: 4px; }
  .verdict .why { color: var(--dim); font-size: 12px; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0 0 14px; font-size: 12.5px; }
  dt { color: var(--dim); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }

  .legend { font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; }
  .legend div { display: flex; gap: 7px; align-items: center; margin-bottom: 5px; }
  .swatch { width: 13px; height: 13px; flex: none; border-radius: 2px; }
  .swatch.safe { outline: 1px solid rgba(95,184,122,.75); }
  .swatch.cover { background: repeating-linear-gradient(45deg, rgba(217,86,74,.35) 0 4px, rgba(217,86,74,.1) 4px 8px); }
  .swatch.margin { outline: 1px dashed rgba(233,230,225,.5); }
  .note { color: var(--warn); }

  button { font: inherit; font-size: 13px; padding: 9px 12px; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--line); background: #2a2930; color: var(--text); }
  button:hover { border-color: #4b4954; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #12121a; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > button { flex: 1; }
  kbd { font: 11px ui-monospace, monospace; background: #12121a; border: 1px solid var(--line);
        border-radius: 3px; padding: 0 4px; color: var(--dim); }
  #done { padding: 40px; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="stage-wrap">
  <div id="stage">
    <img id="photo" alt="">
    <svg id="shade" width="100%" height="100%"><path fill="rgba(10,10,12,.72)" fill-rule="evenodd"></path></svg>
    <div id="crop">
      <div class="handle h-nw" data-h="nw"></div><div class="handle h-n" data-h="n"></div>
      <div class="handle h-ne" data-h="ne"></div><div class="handle h-e" data-h="e"></div>
      <div class="handle h-se" data-h="se"></div><div class="handle h-s" data-h="s"></div>
      <div class="handle h-sw" data-h="sw"></div><div class="handle h-w" data-h="w"></div>
    </div>
  </div>
</div>

<aside>
  <header>
    <h1 id="title">…</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <div class="body" id="panel"></div>
  <footer id="actions"></footer>
</aside>

<script type="module">
import { cropVerdict, VERDICT, maxInscribed } from '/geometry.mjs'

const $ = (s) => document.querySelector(s)
const stage = $('#stage'), photo = $('#photo'), cropEl = $('#crop'), shadePath = $('#shade path')

let queue = [], thresholds = null, i = 0, item = null
let rect = { x: 0, y: 0, w: 0, h: 0 }   // ZAWSZE we współrzędnych pliku source
let scale = 1

/* ---------- kolejka ------------------------------------------------ */

async function load() {
  const data = await (await fetch('/api/queue')).json()
  queue = data.items; thresholds = data.thresholds
  if (!queue.length) return finished()
  i = 0; await show()
}

function finished() {
  document.body.innerHTML = '<div id="done"><h2>Kolejka pusta</h2>' +
    '<p>Wszystkie kadry mają wpis w <code>media/crops.json</code>.</p>' +
    '<p>Zamknij okno i zatrzymaj serwer (Ctrl+C).<br>' +
    'Sprawdzenie: <code>npm run images:check</code></p></div>'
}

async function show() {
  if (i >= queue.length) return finished()
  item = queue[i]
  photo.src = `/api/source/${encodeURIComponent(item.file)}`
  await photo.decode().catch(() => {})
  layout()
  if (item.rect) setRect(item.rect)
  else await suggest()
  renderPanel()
}

/* ---------- skala i układ ------------------------------------------ */

function layout() {
  const wrap = $('#stage-wrap')
  const availW = wrap.clientWidth - 40, availH = wrap.clientHeight - 40
  /* Sufit 1: podgląd nigdy nie powiększa źródła ponad jego własne piksele.
     Bez tego mały plik (np. gotowa kompozycja 1200 px) był rozciągany na
     całą scenę i pokazywał artefakty skalowania, których nie ma ani
     w źródle, ani w wyniku - kadrowało się wtedy na podstawie tego, co
     dorysowała przeglądarka. Mniejszy podgląd jest uczciwszy: od razu
     widać, że plik jest mały. */
  const s = Math.min(availW / item.size.w, availH / item.size.h, 1)
  scale = s
  stage.style.width = `${item.size.w * s}px`
  stage.style.height = `${item.size.h * s}px`
  draw()
}

/* ---------- prostokąt ---------------------------------------------- */

const ratio = () => item.ratio[0] / item.ratio[1]

function clampRect(r) {
  const a = ratio()
  let w = Math.min(r.w, item.size.w)
  let h = w / a
  if (h > item.size.h) { h = item.size.h; w = h * a }
  w = Math.max(32, w); h = w / a
  const x = Math.min(Math.max(0, r.x), item.size.w - w)
  const y = Math.min(Math.max(0, r.y), item.size.h - h)
  return { x, y, w, h }
}

function setRect(r) { rect = clampRect(r); draw(); renderReadout() }

async function suggest() {
  try {
    const res = await (await fetch(`/api/suggest/${encodeURIComponent(item.name)}`)).json()
    setRect(res.rect)
  } catch { setRect(centered(maxInscribed(item.size, item.ratio))) }
}

const centered = (box) => ({ x: (item.size.w - box.w) / 2, y: (item.size.h - box.h) / 2, w: box.w, h: box.h })

/* ---------- rysowanie ---------------------------------------------- */

function draw() {
  const px = { x: rect.x * scale, y: rect.y * scale, w: rect.w * scale, h: rect.h * scale }
  cropEl.style.left = `${px.x}px`; cropEl.style.top = `${px.y}px`
  cropEl.style.width = `${px.w}px`; cropEl.style.height = `${px.h}px`

  const W = item.size.w * scale, H = item.size.h * scale
  shadePath.setAttribute('d',
    `M0 0H${W}V${H}H0Z M${px.x} ${px.y}H${px.x + px.w}V${px.y + px.h}H${px.x}Z`)

  // strefy bezpieczne są ułamkami KADRU, więc jadą razem z nim
  for (const el of cropEl.querySelectorAll('.zone')) el.remove()
  for (const z of item.zones ?? []) {
    if (z.kind === 'note') continue
    const d = document.createElement('div')
    d.className = `zone ${z.kind}`
    if (z.kind === 'margin') {
      d.style.left = `${z.inset * 100}%`; d.style.top = `${z.inset * 100}%`
      d.style.width = `${(1 - 2 * z.inset) * 100}%`; d.style.height = `${(1 - 2 * z.inset) * 100}%`
    } else {
      d.style.left = `${z.x * 100}%`; d.style.top = `${z.y * 100}%`
      d.style.width = `${z.w * 100}%`; d.style.height = `${z.h * 100}%`
    }
    cropEl.appendChild(d)
  }
}

/* ---------- werdykt i panel ---------------------------------------- */

function currentVerdict() {
  const r = { x: Math.round(rect.x), y: Math.round(rect.y), w: Math.round(rect.w), h: Math.round(rect.h) }
  return cropVerdict({
    crop: { widths: item.widths, ratio: item.ratio },
    size: item.size,
    rect: r,
    thresholds
  })
}

function renderReadout() {
  const v = currentVerdict()
  const cls = v.verdict === VERDICT.ZLE ? 'bad' : v.verdict === VERDICT.CIASNY ? 'tight' : 'ok'
  cropEl.className = cls === 'ok' ? '' : cls

  const box = $('#verdict')
  if (box) {
    box.className = `verdict ${cls}`
    box.innerHTML = `<b>${v.verdict.label}</b>` +
      (v.why ? `<span class="why">${v.why}</span>`
             : `<span class="why">po tym kadrze zostanie ${Math.round(rect.w)} px, potrzeba ${v.need} px - zapas ${v.headroomPct.toFixed(0)}%</span>`)
  }
  const dl = $('#readout')
  if (dl) {
    dl.innerHTML = [
      ['kadr', `${Math.round(rect.w)} × ${Math.round(rect.h)} px`],
      ['pozycja', `${Math.round(rect.x)}, ${Math.round(rect.y)}`],
      ['potrzeba', `${v.need} px (największy wariant)`],
      ['zapas', `${v.headroomPct.toFixed(0)} %`],
      ['powierzchnia', `${v.areaPct.toFixed(0)} % źródła`]
    ].map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')
  }
  $('#save').disabled = false
}

function renderPanel() {
  $('#title').textContent = item.name
  const stateLabel = { 'do-kadrowania': 'bez wpisu w crops.json', 'do-weryfikacji': 'źródło podmienione - kadr do weryfikacji', 'zdefiniowany': 'kadr już zapisany', 'odrzucony': 'oznaczony do wymiany' }[item.state]
  $('#subtitle').textContent = `${i + 1} / ${queue.length} · ${item.ratio.join(':')} · ${stateLabel}`

  const notes = (item.zones ?? []).filter((z) => z.kind === 'note')
  const zonesWithGeom = (item.zones ?? []).filter((z) => z.kind !== 'note')

  $('#panel').innerHTML = `
    <div id="verdict" class="verdict ok"></div>
    <dl id="readout"></dl>
    <dl>
      <dt>źródło</dt><dd>${item.file} (${item.size.w}×${item.size.h})</dd>
      <dt>warianty</dt><dd>${item.widths.join(' · ')}${item.lightbox ? ' + powiększenie' : ''}</dd>
      <dt>użycie</dt><dd>${item.uses.join(', ') || '-'}</dd>
    </dl>
    ${notes.map((n) => `<p class="note">⚠ ${n.label}</p>`).join('')}
    ${zonesWithGeom.length ? `<div class="legend">
      ${zonesWithGeom.map((z) => `<div><span class="swatch ${z.kind}"></span>${z.label}</div>`).join('')}
      <div style="margin-top:8px">
        <kbd>Enter</kbd> zapisz · <kbd>S</kbd> pomiń · <kbd>X</kbd> do wymiany<br>
        <kbd>R</kbd> propozycja · <kbd>M</kbd> maksymalny · <kbd>C</kbd> wyśrodkuj · <kbd>Z</kbd> strefy<br>
        <kbd>←↑↓→</kbd> przesuń o 1 px (<kbd>Shift</kbd> = 20 px)
      </div>
    </div>` : ''}
  `
  renderReadout()
}

/* ---------- akcje --------------------------------------------------- */

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const data = await r.json()
  if (!r.ok) { alert(data.error); return false }
  return true
}

async function save() {
  if (await post('/api/save', { name: item.name, rect })) next()
}
function next() { i++; show() }
async function reject() {
  const why = prompt('Dlaczego to zdjęcie tu nie pasuje?', 'po kadrze zostaje za mało / zły kadr tematycznie')
  if (why === null) return
  if (await post('/api/reject', { name: item.name, why })) next()
}

$('#actions').innerHTML = `
  <button id="save" class="primary">Zapisz i dalej</button>
  <div class="row">
    <button id="suggest">Propozycja</button>
    <button id="max">Maksymalny</button>
    <button id="center">Wyśrodkuj</button>
  </div>
  <div class="row">
    <button id="skip">Pomiń</button>
    <button id="reject" class="danger">Oznacz do wymiany</button>
  </div>`
$('#save').onclick = save
$('#skip').onclick = next
$('#reject').onclick = reject
$('#suggest').onclick = suggest
$('#max').onclick = () => setRect({ ...rect, ...maxInscribed(item.size, item.ratio) })
$('#center').onclick = () => setRect(centered({ w: rect.w, h: rect.h }))

/* ---------- mysz ----------------------------------------------------- */

let drag = null
stage.addEventListener('pointerdown', (e) => {
  const handle = e.target.dataset?.h
  if (!handle && e.target !== cropEl) return
  e.preventDefault(); stage.setPointerCapture(e.pointerId)
  drag = { handle, sx: e.clientX, sy: e.clientY, start: { ...rect } }
})
stage.addEventListener('pointermove', (e) => {
  if (!drag) return
  const dx = (e.clientX - drag.sx) / scale, dy = (e.clientY - drag.sy) / scale
  const s = drag.start, a = ratio()

  if (!drag.handle) return setRect({ ...s, x: s.x + dx, y: s.y + dy })

  // Zmiana rozmiaru z zachowaniem proporcji. Kotwicą jest przeciwległy
  // narożnik (albo przeciwległa krawędź), żeby uchwyt nie uciekał spod kursora.
  let w = s.w
  if (drag.handle.includes('e')) w = s.w + dx
  else if (drag.handle.includes('w')) w = s.w - dx
  else if (drag.handle === 's') w = (s.h + dy) * a
  else if (drag.handle === 'n') w = (s.h - dy) * a
  w = Math.max(32, w)
  const h = w / a

  let x = s.x, y = s.y
  if (drag.handle.includes('w')) x = s.x + s.w - w
  if (drag.handle.includes('n')) y = s.y + s.h - h
  if (drag.handle === 'n' || drag.handle === 's') x = s.x + (s.w - w) / 2
  if (drag.handle === 'e' || drag.handle === 'w') y = s.y + (s.h - h) / 2
  setRect({ x, y, w, h })
})
const endDrag = () => { drag = null }
stage.addEventListener('pointerup', endDrag)
stage.addEventListener('pointercancel', endDrag)

/* ---------- klawiatura ------------------------------------------------ */

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return
  const step = e.shiftKey ? 20 : 1
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }
  if (moves[e.key]) { e.preventDefault(); return setRect({ ...rect, x: rect.x + moves[e.key][0], y: rect.y + moves[e.key][1] }) }
  const k = e.key.toLowerCase()
  if (e.key === 'Enter') { e.preventDefault(); save() }
  else if (k === 's') next()
  else if (k === 'x') reject()
  else if (k === 'r') suggest()
  else if (k === 'm') setRect({ ...rect, ...maxInscribed(item.size, item.ratio) })
  else if (k === 'c') setRect(centered({ w: rect.w, h: rect.h }))
  else if (k === 'z') document.body.classList.toggle('hide-zones')
})

addEventListener('resize', () => item && layout())
load()
</script>
</body>
</html>
